name: Build Standalone Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run System Pre-Flight Diagnostics
      run: |
        python tools/doctor.py

    - name: Compile Standalone Application via PyInstaller
      run: |
        python tools/build_exe.py

    - name: Compress Build Artifact
      run: |
        Compress-Archive -Path "dist/AeroFret_Kinetic" -DestinationPath "dist/AeroFret_Kinetic_Windows_x64.zip"

    - name: Upload Build Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: AeroFret_Kinetic_Windows_x64
        path: dist/AeroFret_Kinetic_Windows_x64.zip

    - name: Attach Binary to GitHub Release (If Triggered by Release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AeroFret_Kinetic_Windows_x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
